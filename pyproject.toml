[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevsh"
description = "A Unix shell with a deterministic safety policy and optional natural-language commands powered by TypeSafe Jev."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "Naveen Kenchgunde" }]
keywords = ["shell", "repl", "cli", "natural-language", "typesafe", "jev"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: System :: Shells",
]

# requests is the only thing jevsh imports that it does not ship. Everything
# else in the old requirements.txt was a transitive dependency of it.
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jevsh = "jevsh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "jevsh.__version__" }

[tool.pytest.ini_options]
# src on the path, so tests import `jevsh` -- the same name the installed
# package has. Without this a test could import a second copy as `src.jevsh`
# and patch a module the code under test never sees.
pythonpath = ["src"]
testpaths = ["tests"]
